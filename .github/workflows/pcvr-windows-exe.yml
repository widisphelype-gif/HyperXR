name: Build HyperXR Windows EXE

on:
  push:
    branches: ["feature/pcvr-wifi-usb-foundation"]
    paths:
      - "pcvr/windows/**"
      - ".github/workflows/pcvr-windows-exe.yml"
  pull_request:
    paths:
      - "pcvr/windows/**"
      - ".github/workflows/pcvr-windows-exe.yml"
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build host executable
        run: python -m PyInstaller --clean --onefile --name HyperXR-PCVR-Host pcvr/windows/host.py
      - name: Build capture diagnostic executable
        run: python -m PyInstaller --clean --onefile --name HyperXR-Capture-Test pcvr/windows/capture_probe.py
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: HyperXR-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
