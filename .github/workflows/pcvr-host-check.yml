name: PCVR host checks

on:
  push:
    branches: ["feature/pcvr-wifi-usb-foundation"]
    paths: ["pcvr/**", ".github/workflows/pcvr-host-check.yml"]
  pull_request:
    paths: ["pcvr/**", ".github/workflows/pcvr-host-check.yml"]

jobs:
  python-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile PCVR diagnostics
        run: python -m py_compile pcvr/windows/host.py pcvr/windows/capture_probe.py pcvr/windows/test_host.py pcvr/windows/test_capture_probe.py
      - name: Run tests
        run: python -m unittest discover -s pcvr/windows -p "test_*.py" -v
